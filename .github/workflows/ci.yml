name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Module imports cleanly
        run: python3 -c "import composer; print('ok')"

      - name: Point config.json at the bundled starter template
        run: |
          cat > config.json <<'JSON'
          {
            "template_path": "assets/starter_template.RPP",
            "output_root": "/tmp/ci_out"
          }
          JSON

      - name: Compose smoke test
        run: |
          cat > /tmp/spec.json <<'JSON'
          {
            "song_name": "ci",
            "key": "Em",
            "tempo": 120,
            "time_sig": [4, 4],
            "sections": [
              {
                "name": "verse",
                "feel": "halftime",
                "chords": [
                  {"name": "Em9",   "beats": 4},
                  {"name": "D",     "beats": 4},
                  {"name": "Cmaj7", "beats": 4},
                  {"name": "B7",    "beats": 4}
                ]
              }
            ],
            "form": ["verse"]
          }
          JSON
          mkdir -p /tmp/out
          python3 composer.py compose /tmp/spec.json /tmp/out
          test -f /tmp/out/ci.RPP
          test -f /tmp/out/full.mid
          test -f /tmp/out/verse.mid
          test -f /tmp/out/spec.json
          grep -q "claude_composer_spec_b64" /tmp/out/ci.RPP

      - name: Auto-fill smoke test (multi-section form, fills present in full.mid)
        run: |
          cat > /tmp/fills_spec.json <<'JSON'
          {
            "song_name": "fills-ci",
            "key": "Em",
            "tempo": 120,
            "time_sig": [4, 4],
            "roles": ["bass", "drums"],
            "sections": [
              {"name": "verse",  "feel": "halftime", "chords": [{"name": "Em", "beats": 4},{"name": "D", "beats": 4},{"name": "C", "beats": 4},{"name": "B7", "beats": 4}]},
              {"name": "chorus", "feel": "driving",  "chords": [{"name": "C",  "beats": 4},{"name": "G", "beats": 4},{"name": "D", "beats": 4},{"name": "Em", "beats": 4}]}
            ],
            "form": ["verse", "chorus", "verse", "chorus"]
          }
          JSON
          mkdir -p /tmp/fills_out
          python3 composer.py compose --midi-only /tmp/fills_spec.json /tmp/fills_out
          # 3 transitions in form [verse,chorus,verse,chorus] → 3 fills spliced.
          # FILL_ROTATION position 0 = tom-roll-8ths (uses tom_hi=50, tom_mid=47).
          # FILL_ROTATION position 2 = tom-roll-16ths (uses tom_lo=43 too).
          # All 3 tom pitches (43, 47, 50) must appear in full.mid.
          python3 -c "
          data = open('/tmp/fills_out/full.mid', 'rb').read()
          found = set()
          for i in range(len(data)-2):
              b = data[i]
              if 0x90 <= b <= 0x9F and i+2 < len(data):
                  n, v = data[i+1], data[i+2]
                  if v > 0 and n in (43, 47, 50):
                      found.add(n)
          assert found == {43, 47, 50}, f'expected tom pitches 43/47/50 in full.mid, found {sorted(found)}'
          print('auto-fill splice OK — tom pitches', sorted(found), 'present')
          "

      - name: Compose --midi-only smoke test (no config.json, no .RPP)
        run: |
          rm -f config.json
          mkdir -p /tmp/out_midi
          python3 composer.py compose --midi-only /tmp/spec.json /tmp/out_midi
          test -f /tmp/out_midi/full.mid
          test -f /tmp/out_midi/verse.mid
          test -f /tmp/out_midi/spec.json
          # .RPP must NOT exist in midi-only mode
          test ! -f /tmp/out_midi/ci.RPP
          # restore config for subsequent steps
          cat > config.json <<'JSON'
          {
            "template_path": "assets/starter_template.RPP",
            "output_root": "/tmp/ci_out"
          }
          JSON

      - name: Analyze without COMPOSER region — expect graceful exit 2
        run: |
          set +e
          python3 composer.py analyze /tmp/out/ci.RPP
          rc=$?
          set -e
          test "$rc" = "2"

      - name: Fill smoke test (rename verse-1 region to COMPOSER, fill it)
        run: |
          sed -i 's/"verse-1"/"COMPOSER"/' /tmp/out/ci.RPP
          cat > /tmp/fill.json <<'JSON'
          {
            "roles": ["bass", "pad"],
            "feel": "sparse",
            "drums": "none",
            "move": "ci smoke fill",
            "chords": [
              {"name": "Em9", "beats": 8},
              {"name": "Cmaj7", "beats": 8}
            ]
          }
          JSON
          python3 composer.py fill /tmp/fill.json /tmp/out/ci.RPP
          grep -q "composer-fill-bass" /tmp/out/ci.RPP
          grep -q "composer-fill-pad" /tmp/out/ci.RPP
          grep -q "COMPOSER-FILL feel=" /tmp/out/ci.RPP
